name: Bug report
description: Report a general problem that is not about pointing at a part and editing it.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For "I selected a part, asked for a change, and the result was wrong" reports, use
        the [Edit report](?template=edit-report.yml) form instead.

  - type: dropdown
    id: host
    attributes:
      label: Host
      description: Where you were running the plugin when this happened.
      options:
        - Codex desktop sidebar panel
        - browser page from Codex
        - Claude Code + browser page
        - other MCP client
        - core CLI
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      description: >-
        Read it from `.codex-plugin/plugin.json` (the `version` field), or from the
        MCP server's reported `serverInfo.version` in your host's MCP server list.
        `studio_capabilities` does not report a version.
      placeholder: e.g. 0.8.6
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Relevant lines from `~/.print-prep/studio.log` (or the workspace's own
        `studio.log`). Do not paste API keys or tokens.
    validations:
      required: false
