<!doctype html>
<html lang="zh-CN" data-viewer-contract="scene-viewer-a8-skin-v1">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scene Viewer</title>
    <link rel="icon" href="data:," />
    <style>/* Scene Viewer 皮肤 —— 从 tooling/a8_viewer/styles.css 复制而来。
 *
 * ⚠️ 这是**副本不是引用**：a8 那份改了，这里不会跟着变。之所以复制而不是
 * 共享一份，是因为 scene_viewer 要随 web/ 整包同步进产品仓（sync_to_studio.sh），
 * 跨目录引用在那边取不到。两边真分叉了以 a8 为准回抄。
 *
 * 复制自：tooling/a8_viewer/styles.css
 * 文件末尾 "scene_viewer 增补" 之后是 a8 没有的部分（炸开、部件/关节清单、
 * 陈旧计数、错误帘），照 a8 的排版语言写。
 */

:root {
  color-scheme: light;
  --paper: #f1efe7;
  --paper-bright: #fbfaf5;
  --ink: #1d2825;
  --muted: #68736d;
  --rule: rgba(29, 40, 37, 0.15);
  --rule-strong: rgba(29, 40, 37, 0.28);
  --green: #1f5f4c;
  --green-soft: #dbe7df;
  --amber: #d87a32;
  --amber-soft: #f4dfca;
  --blue: #387a83;
  --red: #a74434;
  --shadow: 0 24px 70px rgba(45, 54, 48, 0.13);
}

* {
  box-sizing: border-box;
}

html,
body,
#app {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: "Avenir Next Condensed", "DIN Condensed", "Helvetica Neue",
    sans-serif;
}

button,
input {
  font: inherit;
}

button {
  color: inherit;
}

#app {
  position: relative;
  isolation: isolate;
  background:
    radial-gradient(circle at 48% 32%, rgba(255, 255, 255, 0.92), transparent 32%),
    linear-gradient(124deg, #f8f6ef 0%, #e9e8df 52%, #dfe5df 100%);
}

#app::before {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  content: "";
  opacity: 0.19;
  background-image:
    linear-gradient(rgba(29, 40, 37, 0.15) 1px, transparent 1px),
    linear-gradient(90deg, rgba(29, 40, 37, 0.15) 1px, transparent 1px);
  background-size: 84px 84px;
  mask-image: linear-gradient(to bottom, transparent 2%, black 25%, transparent 92%);
}

#stage {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  outline: none;
}

.panel-kicker {
  margin: 3px 0 7px;
  color: var(--green);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.curation-toolbar {
  position: absolute;
  top: 24px;
  right: 24px;
  z-index: 8;
  display: grid;
  width: 340px;
  height: 40px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 5px 6px 5px 11px;
  border: 1px solid var(--rule);
  border-radius: 3px 14px 3px 3px;
  background: rgba(251, 250, 245, 0.82);
  box-shadow: 0 8px 30px rgba(45, 54, 48, 0.07);
  backdrop-filter: blur(18px);
}

.catalog-readout {
  display: grid;
  min-width: 0;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: baseline;
  gap: 8px;
}

.catalog-readout span {
  color: var(--green);
  font-size: 8px;
  font-weight: 850;
  letter-spacing: 0.14em;
}

.catalog-readout strong {
  overflow: hidden;
  color: var(--muted);
  font-family: Baskerville, Georgia, serif;
  font-size: 11px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.curation-summary {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 8px;
  font-weight: 850;
  letter-spacing: 0.08em;
}

.curation-summary > span {
  min-width: 27px;
  padding: 4px 5px;
  border: 1px solid var(--rule);
  border-radius: 99px;
  text-align: center;
}

.count-golden {
  color: var(--green);
}

.count-bad {
  color: var(--red);
}

#curation-export {
  height: 27px;
  padding: 0 8px;
  border: 0;
  border-radius: 9px 2px 9px 2px;
  background: var(--ink);
  color: white;
  cursor: pointer;
  font-size: 8px;
  font-weight: 850;
  letter-spacing: 0.1em;
}

#curation-export:hover {
  background: var(--green);
}

#curation-export:disabled {
  opacity: 0.32;
  cursor: not-allowed;
}

.case-rail {
  position: absolute;
  /* 原来只有 top，没有下边界也没有 overflow：case 从 8 个涨到 19 个之后，
     列表直接溢出到视口外，第 10 个往后完全够不着（页面本身是定高舞台，
     body 也不滚）。下边界要避开左下角那张参考图卡片 .evidence-card
     （absolute bottom:28px，高度随图片比例变），所以用 --evidence-h，
     由 index.html 末尾的 ResizeObserver 实时写入。 */
  top: 28px;
  bottom: calc(var(--evidence-h, 240px) + 44px);
  left: 28px;
  z-index: 7;
  display: flex;
  width: 218px;
  flex-direction: column;
  overflow-y: auto;
  overscroll-behavior: contain;
  border-top: 1px solid var(--rule-strong);
  scrollbar-color: rgba(45, 54, 48, 0.25) transparent;
  scrollbar-width: thin;
}

.case-rail::-webkit-scrollbar {
  width: 5px;
}

.case-rail::-webkit-scrollbar-thumb {
  border-radius: 3px;
  background: rgba(45, 54, 48, 0.22);
}

.case-rail::-webkit-scrollbar-thumb:hover {
  background: rgba(45, 54, 48, 0.4);
}

/* 失效类别小标题。sticky 让当前分类在滚动时留在顶部，19 个 case 才认得出
   自己看到哪一类了。 */
.case-group {
  position: sticky;
  top: 0;
  z-index: 1;
  padding: 13px 0 5px;
  border-bottom: 1px solid var(--rule);
  background: linear-gradient(
    to bottom,
    var(--paper, #f4f2ec) 72%,
    rgba(244, 242, 236, 0)
  );
  color: var(--green);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.16em;
  line-height: 1.35;
  text-transform: uppercase;
}

.case-group:first-child {
  padding-top: 7px;
}

.case-row {
  position: relative;
  display: grid;
  min-height: 54px;
  grid-template-columns: 28px minmax(0, 1fr);
  align-items: stretch;
  border-bottom: 1px solid var(--rule);
}

.case-markers {
  display: grid;
  align-content: center;
  gap: 4px;
  padding-right: 7px;
}

.case-mark {
  width: 20px;
  height: 19px;
  padding: 0;
  border: 1px solid var(--rule-strong);
  border-radius: 2px 7px 2px 2px;
  background: rgba(251, 250, 245, 0.54);
  color: var(--muted);
  cursor: pointer;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 8px;
  font-weight: 900;
  line-height: 1;
  opacity: 0.68;
  transition: 150ms ease;
}

.case-mark:hover {
  opacity: 1;
  transform: translateX(1px);
}

.case-mark-golden[aria-pressed="true"] {
  border-color: var(--green);
  background: var(--green);
  color: white;
  opacity: 1;
  box-shadow: 0 4px 12px rgba(31, 95, 76, 0.2);
}

.case-mark-typical_bad[aria-pressed="true"] {
  border-color: var(--red);
  background: var(--red);
  color: white;
  opacity: 1;
  box-shadow: 0 4px 12px rgba(167, 68, 52, 0.18);
}

.case-button {
  position: relative;
  display: grid;
  grid-template-columns: 31px 1fr auto;
  align-items: center;
  gap: 9px;
  min-width: 0;
  min-height: 53px;
  padding: 0 4px 0 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  text-align: left;
  transition:
    padding 180ms ease,
    color 180ms ease,
    background 180ms ease;
}

.case-button::before {
  position: absolute;
  inset: 5px -7px 5px -10px;
  z-index: -1;
  border-radius: 2px 16px 2px 2px;
  background: rgba(251, 250, 245, 0);
  content: "";
  transition: background 180ms ease;
}

.case-button:hover,
.case-button.is-active {
  padding-left: 8px;
  color: var(--green);
}

.case-button.is-active::before {
  background: rgba(251, 250, 245, 0.88);
  box-shadow: 0 8px 28px rgba(45, 54, 48, 0.08);
}

.case-button .case-number {
  color: var(--muted);
  font-family: Baskerville, Georgia, serif;
  font-size: 13px;
  font-style: italic;
}

.case-button strong {
  font-family: Baskerville, Georgia, serif;
  font-size: 15px;
  font-weight: 600;
}

.case-button em {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 0 4px rgba(216, 122, 50, 0.12);
}

.mode-switch {
  position: absolute;
  top: 25px;
  right: 390px;
  z-index: 7;
  display: flex;
  gap: 3px;
  padding: 3px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: rgba(251, 250, 245, 0.74);
  box-shadow: 0 8px 30px rgba(45, 54, 48, 0.07);
  backdrop-filter: blur(18px);
}

.mode-switch button {
  display: flex;
  align-items: baseline;
  gap: 7px;
  padding: 7px 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  transition: 180ms ease;
}

.mode-switch button span {
  font-family: Baskerville, Georgia, serif;
  font-size: 13px;
  font-weight: 700;
}

.mode-switch button.is-active {
  background: var(--green);
  color: white;
  box-shadow: 0 4px 16px rgba(31, 95, 76, 0.2);
}

.mode-switch button:disabled {
  opacity: 0.34;
  cursor: not-allowed;
}

.audit-panel {
  position: absolute;
  top: 76px;
  right: 24px;
  bottom: 24px;
  z-index: 7;
  display: flex;
  width: 340px;
  flex-direction: column;
  overflow: hidden;
  padding: 20px 20px 18px;
  border: 1px solid var(--rule);
  border-radius: 3px 3px 24px 3px;
  background: rgba(251, 250, 245, 0.88);
  box-shadow: var(--shadow);
  backdrop-filter: blur(24px) saturate(0.88);
}

.panel-head {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: start;
  gap: 12px;
  padding-bottom: 15px;
  border-bottom: 1px solid var(--rule);
}

.panel-head h2 {
  margin: 0;
  font-family: Baskerville, "Iowan Old Style", Georgia, serif;
  font-size: 26px;
  font-weight: 400;
  line-height: 1;
  letter-spacing: -0.025em;
}

.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  border: 1px solid rgba(216, 122, 50, 0.28);
  border-radius: 999px;
  background: var(--amber-soft);
  color: #81451b;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.1em;
  white-space: nowrap;
}

.status-chip i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.status-chip[data-state="ready"] {
  border-color: rgba(31, 95, 76, 0.28);
  background: var(--green-soft);
  color: var(--green);
}

.status-chip[data-state="provisional"] {
  border-color: rgba(190, 116, 38, 0.32);
  background: #f4e3c8;
  color: #8b511d;
}

.status-chip[data-state="blocked"] {
  border-color: rgba(167, 68, 52, 0.25);
  background: #f2dcd6;
  color: var(--red);
}

.blocker-note {
  margin: 16px 0 14px;
  padding: 13px 14px 12px;
  border-left: 3px solid var(--amber);
  background:
    linear-gradient(90deg, rgba(216, 122, 50, 0.12), transparent),
    rgba(244, 223, 202, 0.35);
}

.blocker-note span,
.layers p {
  display: block;
  margin: 0 0 4px;
  color: var(--amber);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.18em;
}

.blocker-note strong {
  display: block;
  font-family: Baskerville, Georgia, serif;
  font-size: 16px;
  font-weight: 600;
}

.blocker-note p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.45;
}

.fact-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  margin: 0 0 14px;
  border-top: 1px solid var(--rule);
  border-left: 1px solid var(--rule);
}

.fact-grid div {
  min-height: 62px;
  padding: 9px 10px;
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}

.fact-grid dt {
  color: var(--muted);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.fact-grid dd {
  margin: 5px 0 0;
  font-family: Baskerville, Georgia, serif;
  font-size: 13px;
  line-height: 1.2;
}

.layers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 10px;
  padding-top: 1px;
}

.layers p {
  grid-column: 1 / -1;
  color: var(--green);
}

.layers label {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  cursor: pointer;
  font-size: 9px;
  font-weight: 650;
}

.layers input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.layers label span {
  position: relative;
  width: 22px;
  height: 12px;
  flex: 0 0 auto;
  border-radius: 99px;
  background: #cdd2cd;
  transition: 160ms ease;
}

.layers label span::after {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: white;
  content: "";
  box-shadow: 0 1px 3px rgba(29, 40, 37, 0.25);
  transition: 160ms ease;
}

.layers input:checked + span {
  background: var(--green);
}

.layers input:checked + span::after {
  transform: translateX(10px);
}

.case-note {
  margin: auto 0 0;
  padding-top: 13px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  font-size: 9px;
  font-weight: 560;
  line-height: 1.55;
}

.evidence-card {
  position: absolute;
  bottom: 28px;
  left: 28px;
  z-index: 7;
  width: 218px;
  overflow: hidden;
  border: 1px solid var(--rule);
  border-radius: 3px 3px 16px 3px;
  background: rgba(251, 250, 245, 0.88);
  box-shadow: 0 14px 38px rgba(45, 54, 48, 0.1);
  backdrop-filter: blur(18px);
  transition:
    width 220ms ease,
    transform 220ms ease;
}

.evidence-card.is-expanded {
  width: min(430px, calc(100vw - 400px));
  transform: translateY(-4px);
}

.evidence-image {
  position: relative;
  display: block;
  width: 100%;
  height: 116px;
  overflow: hidden;
  padding: 0;
  border: 0;
  background: #e6e5df;
  cursor: zoom-in;
  transition: height 220ms ease;
}

.evidence-card.is-expanded .evidence-image {
  height: min(55vh, 460px);
  cursor: zoom-out;
}

.evidence-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background:
    linear-gradient(45deg, #f7f6f1 25%, transparent 25%),
    linear-gradient(-45deg, #f7f6f1 25%, transparent 25%),
    #eeede8;
  background-size: 14px 14px;
}

.image-corner {
  position: absolute;
  right: 7px;
  bottom: 7px;
  padding: 3px 5px;
  background: rgba(29, 40, 37, 0.78);
  color: white;
  font-size: 7px;
  font-weight: 800;
  letter-spacing: 0.12em;
}

.evidence-caption {
  padding: 9px 10px 10px;
}

.evidence-caption span {
  display: block;
  margin-bottom: 4px;
  color: var(--green);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 7px;
  letter-spacing: 0.04em;
}

.evidence-caption strong {
  display: block;
  font-family: Baskerville, Georgia, serif;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.25;
}

.pose-deck {
  position: absolute;
  right: 390px;
  bottom: 24px;
  left: 270px;
  z-index: 7;
  display: grid;
  grid-template-columns: 42px 94px 1fr;
  align-items: center;
  gap: 12px;
  min-width: 360px;
  padding: 11px 16px 12px 11px;
  border: 1px solid var(--rule);
  border-radius: 22px 3px 3px 22px;
  background: rgba(251, 250, 245, 0.8);
  box-shadow: 0 12px 36px rgba(45, 54, 48, 0.09);
  backdrop-filter: blur(18px);
}

#play-toggle {
  position: relative;
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: var(--green);
  cursor: pointer;
  box-shadow: 0 4px 13px rgba(31, 95, 76, 0.24);
}

#play-toggle span {
  width: 0;
  height: 0;
  margin-left: 2px;
  border-top: 5px solid transparent;
  border-bottom: 5px solid transparent;
  border-left: 8px solid white;
}

#play-toggle.is-playing span {
  width: 7px;
  height: 10px;
  margin: 0;
  border: 0;
  border-right: 2px solid white;
  border-left: 2px solid white;
}

.pose-copy {
  display: flex;
  flex-direction: column;
}

.pose-copy span {
  color: var(--muted);
  font-size: 7px;
  font-weight: 800;
  letter-spacing: 0.14em;
}

.pose-copy strong {
  color: var(--green);
  font-family: Baskerville, Georgia, serif;
  font-size: 18px;
  font-weight: 600;
}

#pose-slider {
  width: 100%;
  height: 3px;
  appearance: none;
  border-radius: 99px;
  outline: none;
  background: linear-gradient(
    90deg,
    var(--green) 0%,
    var(--green) var(--pose, 42%),
    rgba(29, 40, 37, 0.15) var(--pose, 42%),
    rgba(29, 40, 37, 0.15) 100%
  );
}

#pose-slider::-webkit-slider-thumb {
  width: 14px;
  height: 14px;
  appearance: none;
  border: 3px solid var(--paper-bright);
  border-radius: 50%;
  background: var(--amber);
  cursor: ew-resize;
  box-shadow: 0 0 0 1px rgba(29, 40, 37, 0.18);
}

.pose-marks {
  grid-column: 3;
  display: flex;
  justify-content: space-between;
  margin-top: -8px;
  color: var(--muted);
  font-size: 6px;
  font-weight: 800;
  letter-spacing: 0.12em;
}

.scene-legend {
  position: absolute;
  right: 390px;
  bottom: 90px;
  z-index: 6;
  display: flex;
  gap: 14px;
  color: var(--muted);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.05em;
  pointer-events: none;
}

.scene-legend span {
  display: flex;
  align-items: center;
  gap: 5px;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

.dot-canonical {
  background: var(--green);
}

.dot-source {
  background: #838d88;
}

.dot-completion {
  background: var(--amber);
}

.loading-curtain {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: grid;
  place-content: center;
  background: rgba(241, 239, 231, 0.94);
  opacity: 1;
  pointer-events: all;
  transition: opacity 420ms ease;
}

.loading-curtain.is-hidden {
  opacity: 0;
  pointer-events: none;
}

.loading-curtain p {
  margin-top: 18px;
  color: var(--green);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.22em;
}

.loading-curtain code {
  max-width: calc(100vw - 48px);
  margin-top: 14px;
  padding: 9px 12px;
  border: 1px solid var(--rule-strong);
  border-radius: 4px;
  background: rgba(251, 250, 245, 0.86);
  color: var(--ink);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  letter-spacing: 0;
  user-select: all;
}

.loader-orbit {
  position: relative;
  width: 70px;
  height: 70px;
  margin: auto;
  animation: orbit-spin 2.6s linear infinite;
}

.loader-orbit i {
  position: absolute;
  inset: 0;
  border: 1px solid rgba(31, 95, 76, 0.34);
  border-radius: 50%;
}

.loader-orbit i:nth-child(2) {
  transform: rotateX(68deg);
}

.loader-orbit i:nth-child(3) {
  transform: rotateY(68deg);
}

@keyframes orbit-spin {
  to {
    transform: rotate(360deg);
  }
}

@media (max-width: 1020px) {
  .mode-switch {
    right: 342px;
    top: 20px;
  }

  .curation-toolbar {
    top: 20px;
    right: 16px;
    width: 310px;
  }

  .audit-panel {
    top: auto;
    right: 16px;
    bottom: 16px;
    width: 310px;
    height: 54vh;
  }

  .pose-deck {
    right: 342px;
  }

  .scene-legend {
    right: 342px;
  }
}

@media (max-width: 760px) {
  .case-rail {
    top: 12px;
    right: 12px;
    bottom: auto;  /* 窄屏是横向滚动条，桌面那条 --evidence-h 下边界不适用 */
    left: 12px;
    width: auto;
    flex-direction: row;
    overflow-x: auto;
    overflow-y: hidden;
    border: 0;
  }

  .case-group {
    position: static;
    display: flex;
    align-items: center;
    padding: 0 9px 0 3px;
    border-right: 1px solid var(--rule);
    border-bottom: 0;
    background: none;
    writing-mode: vertical-rl;
  }

  .case-row {
    min-width: 175px;
    border-top: 1px solid var(--rule);
    border-bottom: 0;
  }

  .case-button {
    min-width: 0;
    grid-template-columns: 24px 1fr;
  }

  .case-button em {
    display: none;
  }

  .mode-switch {
    top: 126px;
    right: 12px;
  }

  .curation-toolbar {
    top: 76px;
    right: 12px;
    width: min(310px, calc(100vw - 24px));
  }

  .mode-switch button {
    padding: 6px 9px;
  }

  .audit-panel {
    right: 10px;
    bottom: 10px;
    width: min(310px, calc(100vw - 20px));
    height: 43vh;
  }

  .fact-grid,
  .case-note {
    display: none;
  }

  .evidence-card {
    display: none;
  }

  .pose-deck {
    right: 10px;
    bottom: calc(43vh + 20px);
    left: 10px;
  }

  .scene-legend {
    display: none;
  }
}

/* ───────────────────────── scene_viewer 增补 ─────────────────────────
   a8 没有的几块，照 a8 的排版语言写。 */

/* [hidden] 必须压过下面所有 display 规则 —— 否则 .overlay{display:grid}
   之类会让 hidden 元素照常显示（这条踩过一次，症状是白幕盖住模型）。 */
[hidden] { display: none !important; }

/* a8 的 #stage 就是 canvas；这里是 canvas 的宿主 div，尺寸语义要一致 */
#stage > canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.count-stale {
  color: var(--amber);
}

.count-stale b {
  font-family: Baskerville, Georgia, serif;
  font-size: 14px;
}

/* 部件 / 关节清单：a8 只有四格事实卡，这里要能逐件点选 */
.inspector {
  display: flex;
  min-height: 0;
  flex: 1;
  flex-direction: column;
  padding-top: 12px;
  border-top: 1px solid var(--rule);
  gap: 14px;
  margin-top: 12px;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-color: rgba(45, 54, 48, 0.25) transparent;
  scrollbar-width: thin;
}

.inspector h3 {
  margin: 0 0 7px;
  color: var(--green);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.inspector h3 small {
  margin-left: 5px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.08em;
}

.inspector-row {
  display: grid;
  width: 100%;
  grid-template-columns: 10px minmax(0, 1fr);
  align-items: center;
  gap: 9px;
  padding: 6px 8px;
  border: 0;
  border-radius: 3px;
  background: transparent;
  cursor: pointer;
  text-align: left;
  transition: 140ms ease;
}

.inspector-row:hover,
.inspector-row.is-active {
  background: var(--green-soft);
}

.inspector-row .color-mark {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  background: var(--item-color, var(--green));
}

.inspector-row span {
  display: grid;
  min-width: 0;
}

.inspector-row strong {
  overflow: hidden;
  font-size: 12px;
  font-weight: 700;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.inspector-row em {
  color: var(--muted);
  font-size: 10px;
  font-style: normal;
  letter-spacing: 0.04em;
}

#selection-detail dl {
  display: grid;
  margin: 0;
  gap: 4px;
}

#selection-detail div {
  display: grid;
  grid-template-columns: 76px minmax(0, 1fr);
  gap: 8px;
}

#selection-detail dt {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.08em;
}

#selection-detail dd {
  margin: 0;
  font-size: 11px;
  word-break: break-word;
}

/* 炸开：a8 没有这一层（它只看姿态）。炸开条永远在，相位条按数据出现 ——
   所以把常驻的钉在底部锚点，让条件出现的那条往上叠，避免两条打架。 */
.explode-deck {
  position: absolute;
  right: 390px;
  bottom: 24px;
  left: 270px;
  z-index: 7;
  display: grid;
  min-width: 360px;
  grid-template-columns: auto auto minmax(0, 1fr) 42px;
  align-items: center;
  gap: 12px;
  padding: 9px 16px 9px 11px;
  border: 1px solid var(--rule);
  border-radius: 22px 3px 3px 22px;
  background: rgba(251, 250, 245, 0.8);
  box-shadow: 0 12px 36px rgba(45, 54, 48, 0.09);
  backdrop-filter: blur(18px);
}

.pose-deck:not([hidden]) {
  bottom: 84px;
}

.pose-deck:not([hidden]) ~ .scene-legend {
  bottom: 150px;
}

#fit-view {
  padding: 5px 10px;
  border: 1px solid var(--rule-strong);
  border-radius: 999px;
  background: transparent;
  cursor: pointer;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
}

#fit-view:hover {
  background: var(--green-soft);
}

.explode-copy {
  color: var(--muted);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.16em;
}

/* 填充跟着值走（跟 a8 的 #pose-slider 同一手法）。写死渐变的话，滑块在最左
   也是半条绿的，看起来像"已经炸开一半了"。 */
#explode {
  width: 100%;
  height: 3px;
  border-radius: 999px;
  appearance: none;
  background: linear-gradient(
    90deg,
    var(--green) 0%,
    var(--green) var(--explode, 0%),
    rgba(29, 40, 37, 0.15) var(--explode, 0%),
    rgba(29, 40, 37, 0.15) 100%
  );
  outline: none;
}

#explode::-webkit-slider-thumb {
  width: 13px;
  height: 13px;
  border: 2px solid white;
  border-radius: 50%;
  appearance: none;
  background: var(--green);
  box-shadow: 0 2px 8px rgba(31, 95, 76, 0.34);
  cursor: pointer;
}

#explode-value {
  color: var(--ink);
  font-family: Baskerville, Georgia, serif;
  font-size: 12px;
  text-align: right;
}

/* 加载帘复用为错误帘：加载失败必须看得见，不能停在一张"还在转"的画面上 */
.loading-curtain[data-state="error"] {
  background: rgba(251, 250, 245, 0.95);
}

.loading-curtain[data-state="error"] p {
  max-width: 560px;
  color: var(--red);
  text-align: center;
}

.inspector-row.active {
  background: var(--green-soft);
}

.joint-control {
  display: grid;
  gap: 3px;
  margin-bottom: 6px;
}

.joint-slider {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 68px;
  align-items: center;
  gap: 8px;
  padding: 0 8px 4px 27px;
}

.joint-slider input {
  width: 100%;
  height: 3px;
  border-radius: 999px;
  appearance: none;
  background: rgba(31, 95, 76, 0.24);
  outline: none;
}

.joint-slider input::-webkit-slider-thumb {
  width: 11px;
  height: 11px;
  border: 2px solid white;
  border-radius: 50%;
  appearance: none;
  background: var(--green);
  box-shadow: 0 2px 6px rgba(31, 95, 76, 0.3);
  cursor: pointer;
}

.joint-slider output {
  color: var(--muted);
  font-family: Baskerville, Georgia, serif;
  font-size: 11px;
  text-align: right;
}

.case-stale {
  display: block;
  padding: 0 10px 6px 34px;
  color: var(--amber);
  font-size: 9px;
  letter-spacing: 0.06em;
}

.case-row[data-stale="1"] .case-button strong {
  opacity: 0.55;
}

/* a8 的案条只有"编号 + 名 + 状态点"三列；这里第二列要再叠一行件数/DOF */
.case-copy {
  display: grid;
  min-width: 0;
  gap: 1px;
}

.case-copy strong {
  overflow: hidden;
  font-family: Baskerville, Georgia, serif;
  font-size: 15px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.case-copy small {
  color: var(--muted);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.pose-marks span {
  overflow: hidden;
  max-width: 33%;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 窄屏：a8 把底部那排收成一条，炸开条要跟着走，否则它会用桌面那套
   left:270/right:390 挤成一条负宽的线。 */
@media (max-width: 1020px) {
  .explode-deck {
    right: 342px;
  }
}

@media (max-width: 760px) {
  .explode-deck {
    right: 10px;
    bottom: calc(43vh + 20px);
    left: 10px;
    min-width: 0;
  }

  .pose-deck:not([hidden]) {
    bottom: calc(43vh + 76px);
  }
}

/* a8 的 mode-switch 按钮里是 <span>大名</span> + 一段说明文字；这里说明用 <i>
   包住，好让它跟大名各自控制字号。 */
.mode-switch button i {
  font-size: 9px;
  font-style: normal;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.mode-switch button[data-mode="split"] span {
  font-family: system-ui, sans-serif;
}

/* 不可用的图层行：常驻但置灰。行消失会让人以为"这版少了个功能"，
   而真相通常是"这案没有这层的数据"。 */
.layers label.is-disabled {
  cursor: not-allowed;
  opacity: 0.38;
}

.layers label.is-disabled input {
  pointer-events: none;
}

.explode-deck.is-disabled .explode-copy,
.explode-deck.is-disabled #explode,
.explode-deck.is-disabled #explode-value {
  cursor: not-allowed;
  opacity: 0.34;
}

/* 对照档下，逐件清单说的不是舞台上那个东西 —— 标灰提示 */
.inspector section.is-muted {
  opacity: 0.42;
}

/* 目录选择器要长得跟 a8 那行标题一样，不像个表单控件 */
.catalog-readout select {
  overflow: hidden;
  min-width: 0;
  padding: 0;
  border: 0;
  appearance: none;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  font-family: Baskerville, Georgia, serif;
  font-size: 13px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.catalog-readout select:hover {
  color: var(--green);
}

/* Lux3D palette is the shared authority for every workspace (SPEC.md §9).
   Neutral surfaces carry hierarchy; blue is reserved for selection and actions. */
:root, #wb, #print-prep-app {
  color-scheme: dark;
  --studio-stage: radial-gradient(ellipse 55% 45% at 12% 0%, #ffffff0d, transparent 70%), radial-gradient(ellipse 60% 46% at 50% 48%, #4da3ff0c, transparent 72%), #000;
  --bg-app: #000000;
  --bg-column: #080808;
  --bg-card: rgba(16,16,18,.86);
  --bg-toolbar: rgba(41,45,50,.92);
  --bg-selected: #0d1528;
  --bg-tile: rgba(255,255,255,.045);
  --bg-control: rgba(255,255,255,.07);
  --bg-control-hi: rgba(255,255,255,.12);
  --line: #ffffff14;
  --line-strong: #ffffff26;
  --line-card: #ffffff1f;
  --text: #ededed;
  --text-dim: #b8bac1;
  --text-faint: #929298;
  --accent: #2261f5;
  --accent-hover: #3973ff;
  --accent-ink: #ffffff;
  --accent-text: #79b7ff;
  --accent-line: #7199f2;
  --accent-ring: #7199f233;
  --focus-ring: #79b7ff;
  --ok: #34d399;
  --ok-soft: #34d39914;
  --warn: #ffbc33;
  --warn-soft: #ffbc3314;
  --danger: #fb7185;
  --danger-soft: #fb718518;
  --ai: var(--accent-text);
  --ai-soft: var(--bg-selected);
  --r-card: 18px;
  --r-tile: 12px;
  --r-ctl: 10px;
  --blur-float: blur(20px);
  --shadow-float: 0 12px 32px #0005;
  --pico-font-family: 'Workbench Plex', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --pico-font-size: 12px;
  --pico-line-height: 1.5;
  --pico-spacing: 1rem;
  --pico-form-element-spacing-vertical: .5rem;
  --pico-form-element-spacing-horizontal: .75rem;
  --pico-background-color: var(--bg-column);
  --pico-color: var(--text);
  --pico-muted-color: var(--text-dim);
  --pico-primary: var(--accent-text);
  --pico-primary-background: var(--accent);
  --pico-primary-border: var(--accent);
  --pico-form-element-background-color: var(--bg-control);
  --pico-form-element-color: var(--text);
  --pico-form-element-border-color: var(--line-strong);
  --pico-form-element-placeholder-color: var(--text-faint);
  --pico-form-element-focus-color: var(--accent-ring);
  --pico-border-radius: 6px;
  --pico-table-border-color: var(--line);
  font: 12px/1.5 var(--pico-font-family);
}

/* Studio's assembly tools use the same theme.css as editing and printing.
   Legacy variable names below are adapters, not a second palette. */
:root {
  color-scheme:dark;
  --paper:var(--bg-app); --paper-bright:var(--bg-column);
  --ink:var(--text); --muted:var(--text-dim);
  --rule:var(--line); --rule-strong:var(--line-strong);
  --green:var(--accent-text); --green-soft:var(--bg-selected);
  --amber:var(--warn); --amber-soft:var(--warn-soft);
  --blue:var(--accent-text); --red:var(--danger); --shadow:var(--shadow-float);
  --review-left:224px; --review-right:304px;
}
body {font:12px/1.5 var(--pico-font-family); color:var(--text); background:var(--bg-app)}
#app {background:var(--studio-stage)}
#app::before {display:none}
#stage canvas {width:100%;height:100%;object-fit:contain}
/* One type scale, including the old report's serif headings and numeric labels. */
#app :is(button,select,input,h2,strong,dd,output,.case-number,.count-stale b) {font-family:inherit;font-style:normal;letter-spacing:0}
#app :is(button,select,input):focus-visible {outline:2px solid var(--focus-ring);outline-offset:3px}
#app :is(.case-rail,.audit-panel,.evidence-card,.curation-toolbar,.mode-switch,.pose-deck,.explode-deck) {
  background:var(--bg-card);border:1px solid var(--line-card);border-radius:var(--r-card);
  box-shadow:var(--shadow-float);backdrop-filter:var(--blur-float);
}
#app :is(button,select) {color:var(--text);font-weight:500;box-shadow:none}
#app button {cursor:pointer;transition:background-color .12s,color .12s}
#app button:hover:not(:disabled) {background:var(--bg-control-hi)}
#app button:disabled {cursor:not-allowed}
#app :is(.panel-kicker,.case-group-label,.inspector h3,.layers p) {font-size:11px;font-weight:500;letter-spacing:0;color:var(--text-dim);text-transform:none}
#app :is(.case-copy small,.case-number,.case-note,.evidence-caption span,.pose-copy span,.pose-marks,.explode-copy,.scene-legend) {font-size:10px;letter-spacing:0;font-weight:400}
#app .case-rail {left:16px;top:16px;width:208px;padding:8px;bottom:calc(var(--evidence-h,190px) + 36px);scrollbar-color:var(--line-strong) transparent}
#app .case-group-label {background:var(--bg-column);padding:8px;border-bottom:1px solid var(--line)}
#app .case-row {border-color:var(--line)}
#app .case-mark {border:1px solid var(--line-strong);border-radius:6px;background:var(--bg-control);color:var(--text-dim);opacity:1;width:23px;height:23px}
#app .case-mark-golden[aria-pressed=true] {background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
#app .case-mark-typical_bad[aria-pressed=true] {background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
#app .case-mark:hover {transform:none}
#app .case-button {padding:7px 5px;gap:6px;grid-template-columns:23px minmax(0,1fr) auto;border-radius:var(--r-ctl);min-height:52px}
#app .case-button::before {display:none}
#app .case-button.is-active {background:var(--bg-selected);color:var(--accent-text)}
#app .case-copy strong {font-size:12px;font-weight:500}
#app .curation-toolbar {top:16px;right:16px;width:288px;height:42px;padding:6px 10px;gap:6px;border-radius:999px}
#app .catalog-readout {grid-template-columns:minmax(0,1fr)}
#catalog-kind {display:none}
#app .catalog-readout select {font-size:11px;color:var(--text);font-weight:500}
#app .curation-summary {font-size:10px;gap:4px;letter-spacing:0}
#app #curation-export {height:28px;border-radius:999px;background:var(--bg-control);color:var(--text);font-size:10px;letter-spacing:0}
#app .audit-panel {top:70px;right:16px;bottom:20px;width:288px;height:auto;padding:16px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
#app .audit-panel>* {flex-shrink:0}
#app .panel-head {gap:8px;padding-bottom:12px;align-items:center}
#app .panel-head h2 {font-size:16px;line-height:1.4;font-weight:500;overflow-wrap:anywhere}
#app .status-chip {padding:4px 7px;font-size:9px;font-weight:500;letter-spacing:0;background:var(--warn-soft);color:var(--warn);border-color:var(--line-strong)}
#app .status-chip[data-state=ready] {color:var(--ok);background:var(--ok-soft)}
#app .status-chip[data-state=provisional] {color:var(--warn);background:var(--warn-soft)}
#app .status-chip[data-state=blocked] {color:var(--danger);background:var(--danger-soft)}
#app .blocker-note {margin:12px 0;padding:10px;background:var(--warn-soft);border:1px solid var(--line);border-left:2px solid var(--warn);border-radius:var(--r-ctl)}
#app .blocker-note span {font-size:10px;letter-spacing:0;font-weight:500}
#app .blocker-note strong {font-size:12px;font-weight:500;line-height:1.5}
#app .blocker-note p {font-size:11px;line-height:1.6}
#app .fact-grid {margin:12px 0;border:0;gap:6px}
#app .fact-grid div {border:0;min-height:60px;padding:9px;background:var(--bg-tile);border-radius:var(--r-ctl)}
#app .fact-grid dt {font-size:10px;font-weight:400;letter-spacing:0}
#app .fact-grid dd {font-size:11px;line-height:1.5}
#app .layers {gap:10px 8px;margin:10px 0 14px}
#app .layers label {font-size:10px;font-weight:400;color:var(--text-dim);min-width:0}
#app .layers label span {background:var(--bg-control-hi)}
#app .layers input:checked+span {background:var(--accent)}
#app .layers input:focus-visible+span {outline:2px solid var(--focus-ring);outline-offset:3px}
#app .inspector {overflow:visible;flex:none;margin-top:12px;gap:16px}
#app .inspector-row {border-radius:var(--r-ctl);padding:7px 6px}
#app .inspector-row.is-active {background:var(--bg-selected);color:var(--accent-text)}
#app .inspector-row strong {font-size:11px;font-weight:500}
#app .inspector-row em {font-size:10px;letter-spacing:0}
#app .evidence-card {width:208px;bottom:20px;left:16px}
#app .evidence-card.is-expanded {width:min(400px,calc(100vw - 336px))}
#app .evidence-caption strong {font-size:11px;font-weight:400;line-height:1.6;color:var(--text-dim)}
#app .evidence-image,#app .evidence-image img {background:var(--bg-control)}
#app .image-corner {background:var(--bg-toolbar);letter-spacing:0;font-size:9px;font-weight:400;border-radius:5px}
#app .mode-switch {top:16px;left:calc(var(--review-left) + 16px);right:auto;max-width:calc(100% - var(--review-left) - var(--review-right) - 32px);border-radius:999px}
#app .mode-switch button {min-width:0;padding:7px 10px;gap:5px;font-size:11px}
#app .mode-switch button :is(span,i) {font-family:inherit;font-size:11px;letter-spacing:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#app .mode-switch button.is-active {background:var(--bg-selected);color:var(--accent-text)}
#app :is(.pose-deck,.explode-deck) {left:calc(var(--review-left) + 16px);right:calc(var(--review-right) + 16px);min-width:0;padding:10px 12px;gap:10px;border-radius:999px}
#app .pose-deck {grid-template-columns:32px 54px minmax(0,1fr);bottom:78px}
#app .explode-deck {bottom:20px;grid-template-columns:auto auto minmax(0,1fr) 32px}
#app .pose-copy strong {font-size:15px;color:var(--text);font-weight:500}
#app #play-toggle {width:32px;height:32px;background:var(--accent)}
#app #fit-view {border:1px solid var(--line-strong);border-radius:999px;background:var(--bg-control);font-size:11px;font-weight:500}
#app :is(#pose-slider,#explode,.joint-slider input) {background:var(--line-strong);accent-color:var(--accent);min-width:0}
#app :is(#pose-slider,#explode,.joint-slider input)::-webkit-slider-thumb {background:var(--accent-text);border:2px solid var(--bg-column);box-shadow:0 0 0 1px var(--line-strong)}
#app :is(.joint-slider output,#explode-value) {font-size:10px;color:var(--text-dim)}
#app .scene-legend {right:calc(var(--review-right) + 16px);bottom:150px;font-size:10px}
#app .loading-curtain {background:var(--bg-app);color:var(--text)}
#app .loading-curtain h2 {font-size:18px;font-weight:500}
#app .review-session {position:absolute;bottom:2px;left:16px;z-index:4;max-width:calc(100% - 32px);color:var(--text-faint);font-size:9px;pointer-events:none}
#inspector-toggle {display:none}
#app[data-curation=disabled] :is(.curation-toolbar,.case-markers) {display:none}
#app[data-curation=disabled] .case-row {grid-template-columns:1fr}
#app[data-curation=disabled] .audit-panel {top:16px}
@media(max-width:1100px) {
  :root {--review-left:0px}
  #app .case-rail {width:200px;max-height:132px;bottom:auto}
  #app .evidence-card {display:none}
  #app .mode-switch {top:160px}
  #app .scene-legend {display:none}
}
@media(max-width:760px) {
  :root {--review-left:0px;--review-right:0px}
  #app .case-rail {left:12px;right:12px;top:12px;bottom:auto;width:auto;max-height:64px;padding:4px 8px;border-radius:var(--r-tile);flex-direction:row}
  #app .case-group-label {padding:0 7px;background:transparent}
  #app .case-row {min-width:180px;border:0}
  #app .case-button {min-height:48px}
  #app .curation-toolbar {top:86px;left:12px;right:12px;width:auto;height:36px}
  #app .mode-switch {top:132px;left:12px;right:108px;max-width:none;overflow:hidden}
  #app .mode-switch button {flex:1;min-width:0;padding:5px}
  #app .mode-switch button i {font-size:10px}
  #app #inspector-toggle {display:block;position:absolute;top:134px;right:12px;z-index:10;padding:6px 10px;border:1px solid var(--line-strong);border-radius:999px;background:var(--bg-toolbar);font-size:11px}
  #app .audit-panel {top:176px;bottom:138px;left:12px;right:12px;width:auto;height:auto;padding:14px;background:var(--bg-column)}
  #app .audit-panel.is-collapsed {display:none}
  #app .fact-grid {display:grid}
  #app .case-note {display:block}
  #app :is(.pose-deck,.explode-deck) {left:12px;right:12px}
  #app .pose-deck {bottom:76px}
  #app .explode-deck {bottom:20px}
  #app[data-curation=disabled] .mode-switch {top:86px}
  #app[data-curation=disabled] #inspector-toggle {top:88px}
  #app[data-curation=disabled] .audit-panel {top:130px}
}
@media(max-height:560px) and (max-width:760px) {
  #app .audit-panel {top:76px;bottom:20px;z-index:11}
  #app #inspector-toggle {z-index:12}
  #app[data-curation=disabled] .audit-panel {top:76px}
}

#app .loading-command {background:var(--bg-card);border-color:var(--line-strong);color:var(--text-dim)}
</style>
    
  </head>
  <body>
    <!-- 版式与 a8 审阅台一致：满幅舞台 + 悬浮面板。
         a8 的每块面板都对应一个审阅动作，换成三栏网格后那种"眼睛不用挪"的
         读法就没了 —— 所以这里照抄 a8 的构图，只把它的四件套输入换成
         单份 assembly-scene/v1。 -->
    <main id="app">
      <div id="stage" aria-label="三维场景"></div>

      <nav id="case-rail" class="case-rail" aria-label="选择场景；↑/↓ 切换"></nav>

      <!-- 对照层三档。没有对照就整条不出现 —— 一个只有一个选项的模式选择器
           没有意义（a8 现在那条就是，它的 A2 数据源早没了）。 -->
      <section class="mode-switch" id="mode-switch" hidden aria-label="对照模式">
        <button type="button" data-mode="a8" class="is-active">
          <span id="mode-main-name">A8</span>
          <i id="mode-main-caption">当前</i>
        </button>
        <button type="button" data-mode="a2">
          <span id="mode-compare-name">A2</span>
          <i id="mode-compare-caption">对照</i>
        </button>
        <button type="button" data-mode="split">
          <span>⇔</span>
          <i>并排</i>
        </button>
      </section>

      <section class="curation-toolbar" aria-label="目录与人工标记">
        <div class="catalog-readout">
          <span id="catalog-kind">BATCH</span>
          <!-- 目录切换（批次 / golden / bad）。用 select 而不是三个按钮：
               批次数量是随 registry 长的，按钮排不下。 -->
          <select id="catalog-title" aria-label="切换目录"></select>
        </div>
        <div class="curation-summary" aria-label="标记统计">
          <span class="count-golden"><b id="golden-count">0</b> G</span>
          <span class="count-bad"><b id="bad-count">0</b> B</span>
          <span class="count-stale" id="stale-wrap" hidden><b id="stale-count">0</b> 陈旧</span>
          <button id="curation-export" type="button" title="导出当前目录的人工决定">导出标记</button>
        </div>
      </section>

      <aside class="evidence-card" id="evidence-card" hidden>
        <button id="reference-toggle" class="evidence-image" type="button" aria-label="放大或收起参考图">
          <img id="reference-image" alt="" />
          <span class="image-corner">输入参考</span>
        </button>
        <div class="evidence-caption">
          <span id="reference-hash">—</span>
          <strong id="reference-note">下面的件与关节都是这一单实际跑出来的。</strong>
        </div>
      </aside>

      <aside class="audit-panel">
        <div class="panel-head">
          <div>
            <p id="case-index" class="panel-kicker">—</p>
            <h2 id="case-title">Loading</h2>
          </div>
          <span id="status-chip" class="status-chip" data-state="loading"><i></i>LOADING</span>
        </div>

        <div id="blocker-note" class="blocker-note" hidden>
          <span>这案要看的地方</span>
          <strong id="blocker-title">—</strong>
          <p id="blocker-copy">—</p>
        </div>

        <dl class="fact-grid">
          <div><dt>拓扑</dt><dd id="fact-topology">—</dd></div>
          <div><dt>来源</dt><dd id="fact-source">—</dd></div>
          <div><dt>切割 label</dt><dd id="fact-a2">—</dd></div>
          <div><dt>分组 · 关节</dt><dd id="fact-a8">—</dd></div>
        </dl>

        <div class="layers">
          <p>显示图层</p>
          <label>
            <input id="source-toggle" type="checkbox" checked />
            <span></span>
            原始模型
          </label>
          <label id="completion-label">
            <input id="completion-toggle" type="checkbox" />
            <span></span>
            补全部分
          </label>
          <label>
            <input id="label-toggle" type="checkbox" />
            <span></span>
            编号 / 分组
          </label>
          <label>
            <input id="audit-toggle" type="checkbox" />
            <span></span>
            透视检查
          </label>
          <label>
            <input id="wire-toggle" type="checkbox" />
            <span></span>
            线框
          </label>
          <label id="texture-layer-label">
            <input id="texture-toggle" type="checkbox" />
            <span></span>
            原材质（关掉=分件配色）
          </label>
        </div>

        <p id="case-note" class="case-note">—</p>

        <div class="inspector" id="inspector">
          <section id="selection-detail" hidden></section>
          <section id="joints-section" hidden>
            <h3>关节 <small id="joints-count">0</small></h3>
            <div id="joints-list"></div>
          </section>
          <section id="parts-section">
            <h3>部件 <small id="parts-count">0</small></h3>
            <div id="parts-list"></div>
          </section>
        </div>
      </aside>

      <button id="inspector-toggle" type="button" aria-expanded="false">部件与关节</button>

      <!-- 机构相位：一个 0→1 驱动全部关节。参数化线的行程全写成 [0,X]，
           逐关节滑杆对它是错的抽象。没有可动关节时整条隐藏。 -->
      <section class="pose-deck" id="pose-deck" hidden>
        <button id="play-toggle" type="button" aria-label="播放姿态动画" aria-pressed="false"><span></span></button>
        <div class="pose-copy">
          <span>机构开合</span>
          <strong id="pose-value">0%</strong>
        </div>
        <input id="pose-slider" type="range" min="0" max="1" step="0.005" value="0" aria-label="机构姿态" />
        <div class="pose-marks"><span id="phase-lo">0</span><span>REFERENCE</span><span id="phase-hi">1</span></div>
      </section>

      <section class="explode-deck">
        <button id="fit-view" type="button">回正视角</button>
        <label class="explode-copy" for="explode">炸开</label>
        <input id="explode" type="range" min="0" max="1.5" step="0.01" value="0" aria-label="炸开距离" />
        <output id="explode-value">0%</output>
      </section>

      <div class="scene-legend" id="scene-legend" aria-hidden="true">
        <span><i class="dot dot-source"></i>件几何（逐件配色 / 原材质）</span>
        <span id="legend-completion" hidden><i class="dot dot-completion"></i>关节示意（求解出来的轴与原点）</span>
      </div>

      <div id="loading-curtain" class="loading-curtain" data-state="loading">
        <div id="loader-orbit" class="loader-orbit"><i></i><i></i><i></i></div>
        <p id="loading-message">LOADING PARTS</p>
        <code id="loading-command" hidden></code>
      </div>
      <p class="review-session">G/B 标记仅在本次预览中，导出 JSON 保存 · 原数据只读</p>
    </main>
